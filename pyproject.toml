[project]
name = "rag-chatbot-tung"
version = "0.1.0"
description = "A Retrieval Augmented Generation chatbot for intelligent document Q&A"
readme = "README.md"
authors = [
    { name = "tungnei", email = "tug1082003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "qdrant-client>=1.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "tiktoken>=0.6.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
# Opt-in only. Pulls in torch, which dwarfs everything else here — the cost is paid by
# whoever turns reranking on, not by every install of a feature that ships disabled.
rerank = ["sentence-transformers>=3.0", "torch>=2.0"]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
rag-chatbot-tung = "rag_chatbot_tung:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# torch defaults to the CUDA build, which drags in the whole nvidia toolkit — several
# gigabytes of GPU runtime for a reranker this project runs with device: cpu. Pinning
# the CPU wheel index keeps the optional extra to something an operator can actually
# install, and matches what rerank.device is set to.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
