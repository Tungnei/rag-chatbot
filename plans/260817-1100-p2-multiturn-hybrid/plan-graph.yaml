      - src/rag_chatbot_tung/configs.py
      - configs/default.yaml
      - src/rag_chatbot_tung/api/static/index.html
      # B1: tầng metadata thay thế phép cắt trong retrieve(), nên đường đo phải
      # đi qua nó. Cùng lý do với P8.
      - src/rag_chatbot_tung/evaluate/metrics.py
