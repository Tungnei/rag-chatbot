services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT__URL: http://qdrant:6333
      API__HOST: 0.0.0.0
      API__PORT: "8000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/uploads:/app/data/uploads

volumes:
  qdrant_storage:
