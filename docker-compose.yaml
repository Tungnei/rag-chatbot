services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      QDRANT__URL: http://qdrant:6333
      API__HOST: 0.0.0.0
      # Stays 8000 inside the container: the published port maps 8001 -> 8000, and the
      # Dockerfile healthcheck probes localhost:8000 from within. Change the host side
      # in `ports` to move the port you browse to.
      API__PORT: "8000"
    volumes:
      - ./data/documents:/app/data/documents
      - ./data/uploads:/app/data/uploads

volumes:
  qdrant_storage:
