<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>RAG Chatbot</h1>
      <nav><a href="/ui/admin/">Quản lý tài liệu</a></nav>
    </header>

    <main class="layout">
      <section class="chat" aria-label="Hội thoại">
        <p id="history-notice" class="notice">
          Bot nhớ <strong>3 lượt</strong> hỏi-đáp gần nhất. Lịch sử chỉ nằm trong trang
          này và mất khi bạn <strong>tải lại</strong> — máy chủ không lưu gì.
          <span id="history-count" class="muted">Đang gửi kèm: 0 lượt.</span>
        </p>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="composer" autocomplete="off">
          <textarea
            id="question-input"
            rows="2"
            maxlength="2000"
            required
            placeholder="Nhập câu hỏi rồi nhấn Enter…"
          ></textarea>
          <button id="send-button" type="submit">Gửi</button>
        </form>
      </section>

      <aside class="sources" aria-label="Nguồn">
        <div class="panel-head">
          <h2>Nguồn</h2>
          <span id="sources-count" class="muted"></span>
        </div>
        <div id="sources-panel" class="sources-panel">
          <p class="muted">Nguồn của câu trả lời sẽ hiện ở đây.</p>
        </div>

        <div class="params">
          <h2>Tham số</h2>
          <label for="top-k">
            Số đoạn truy xuất: <output id="top-k-value">3</output>
          </label>
          <input id="top-k" type="range" min="1" max="20" step="1" value="3" />
          <label class="checkbox">
            <input id="include-sources" type="checkbox" checked />
            Trả kèm nguồn
          </label>
        </div>
      </aside>
    </main>

    <script src="/ui/app.js"></script>
  </body>
</html>
